# Bayesian optimization sweep for architecture-specific tuning
# 100 trials per architecture to find optimal hyperparameters

# Base configurations for each architecture
base_configs:
  mbert: "configs/experiments/base_mbert.yaml"
  xlmr: "configs/experiments/base_xlmr.yaml"
  tiroberta: "configs/experiments/base_tiroberta.yaml"
  gpt2: "configs/experiments/base_gpt2.yaml"

# Search space definitions
search_space:
  # Common parameters across all architectures
  rank_range: [4, 64]
  alpha_range: [4, 128]
  dropout_range: [0.0, 0.3]
  learning_rate_range: [1e-6, 1e-3]
  num_epochs_range: [3, 15]
  batch_sizes: [8, 16, 32, 64]
  
  # Architecture-specific target modules
  target_modules:
    mbert:
      lora: ["query", "value"]
      dora: ["query", "value"]
      progressive: ["query", "value", "key", "output.dense"]
    
    xlmr:
      lora: ["query", "key", "value", "output.dense"]
      dora: ["query", "value"]
      progressive: ["query", "value", "key", "output.dense"]
    
    tiroberta:
      lora: ["query", "value", "key", "output.dense"]
      dora: ["query", "value"]
      progressive: ["query", "value", "key", "output.dense"]
    
    gpt2:
      lora: ["c_attn", "c_proj"]
      dora: ["c_attn"]
      progressive: ["c_attn", "c_proj", "c_fc"]
  
  # Progressive PEPT specific
  progressive_params:
    base_method_options: ["lora", "dora"]
    initial_rank_range: [4, 16]
    final_rank_range: [16, 64]
    rank_schedule_options: ["linear", "exponential", "step"]
    allocation_strategy_options: ["proportional", "top_k", "threshold"]

# Optimization settings
optimization:
  type: "multi_objective"  # Maximize accuracy, minimize trainable %
  n_trials: 100
  sampler: "TPE"  # Tree-structured Parzen Estimator
  pruner: "MedianPruner"
  directions: ["maximize", "minimize"]  # accuracy, trainable_percentage
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    min_trials: 20

# Output settings
output:
  study_name: "bopet_architecture_sweep"
  storage: "sqlite:///sweep_results.db"
  visualize: true
  pareto_front: true
  parallel: true
  max_workers: 4

# Analysis to perform
analysis:
  pareto_front_analysis: true
  hyperparameter_importance: true
  architecture_comparison: true
  generate_guidelines: true