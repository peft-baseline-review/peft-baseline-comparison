# configs/models/bert-base-multilingual-cased.yaml
name: "bert-base-multilingual-cased"
architecture: "bert"
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
intermediate_size: 3072
max_position_embeddings: 512
vocab_size: 119547
pretrained: true
freeze_base: false
torch_dtype: "float32"
target_modules:
  lora: ["query", "value"]
  dora: ["query", "value"]
  adalora: ["query", "value", "key"]
  prefix: ["key", "value"]
  prompt: ["prompt_embeddings"]
  ia3: ["key", "value", "output.dense"]
  progressive: ["query", "value", "key", "output.dense"]
  qlora: ["query", "value", "key", "output.dense"]
  bitfit: ["bias"]