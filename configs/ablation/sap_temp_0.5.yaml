# configs/ablation/tiroberta_tidg/sap_temp_0.5.yaml
base_config: "configs/experiments/tiroberta_tidg_base.yaml"
output_dir: "results/ablations/tiroberta_tidg/sap_temp_0.5"
replication_count: 5
# ... (copy other fields from a baseline YAML, but keep only one method)
baseline_methods:
  - name: "sap_temp_0.5"
    description: "SAP-PEFT with temperature 0.5"
    peft_method: "progressive"
    config_overrides:
      peft.method: "progressive"
      peft.allocation_strategy: "structure"
      peft.initial_rank: 8
      peft.min_rank: 2
      peft.max_rank: 32
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      peft.allocation_update_frequency: 200
      peft.temperature: 0.5
      training.learning_rate: 2e-4
      peft.optimize_hyperparams: false