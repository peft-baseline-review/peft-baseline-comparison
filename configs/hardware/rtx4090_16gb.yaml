# Hardware profile for NVIDIA GeForce RTX 4090 16GB
# Optimized for PEFT research with mixed precision
hardware_profile:
  gpu_name: "NVIDIA GeForce RTX 4090"
  memory_gb: 16
  cuda_cores: 16384
  tensor_cores: 512
  memory_bandwidth_gbps: 1008
  l2_cache_mb: 72
  compute_capability: 8.9
  architecture: "Ada Lovelace"

optimizations:
  # Precision settings
  use_tf32: true
  use_bfloat16: true
  allow_tf32_matmul: true
  allow_tf32_cudnn: true
  
  # Memory optimization
  max_split_size_mb: 512
  memory_fraction: 0.95
  pinned_memory: true
  
  # Performance settings
  cudnn_benchmark: false  # Disable for reproducible experiments
  cudnn_deterministic: true
  
  # Batch size recommendations
  base_batch_sizes:
    tiny: [1, 2, 4]
    small: [4, 8, 16]
    medium: [8, 16, 32]
    large: [16, 32, 64]
  
  # Model size thresholds (GB)
  model_size_thresholds:
    tiny: 0.1
    small: 0.5
    medium: 2.0
    large: 7.0

memory_settings:
  # Memory allocation strategy
  allocation_strategy: "max_split"
  fragmentation_avoidance: true
  
  # Reserved memory
  system_reserved_gb: 2.0
  cuda_context_gb: 0.5
  
  # Cache settings
  enable_persistent_cache: true
  cache_size_gb: 4.0

validation:
  # Validation tests for hardware
  test_tensor_cores: true
  test_memory_bandwidth: true
  test_mixed_precision: true
  min_acceptable_performance: 0.8