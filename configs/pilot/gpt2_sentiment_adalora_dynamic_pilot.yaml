# Pilot: dynamic AdaLoRA (native 12 -> 8 schedule) on
# GPT-2/sentiment. Two seeds, single method, isolated output.
# Does NOT modify any baseline config or results directory.

base_config: "configs/experiments/gpt2_sentiment_base.yaml"

output_dir: "results/pilot/gpt2_sentiment_adalora_dynamic"
replication_count: 5
use_mlflow: false
parallel: false
max_workers: 1

statistical_analysis:
  confidence_level: 0.95
  bootstrap_samples: 100
  statistical_tests: ["effect_size"]
  multiple_comparison_correction: "holm"
  min_samples_for_analysis: 2

platform_optimizations:
  windows:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  linux:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  darwin:
    num_workers: 2
    pin_memory: false
    use_amp: true
    gradient_accumulation_steps: 2

baseline_methods:
  - name: "gpt2_sentiment_adalora_dynamic"
    description: "AdaLoRA, native dynamic 12 -> 8 pruning schedule (pilot)"
    peft_method: "adalora"
    scientific_role: "experimental"
    priority: 1
    expected_compute_hours: 0.7
    config_overrides:
      peft.method: "adalora"
      peft.optimize_hyperparams: false
      peft.rank: 8
      peft.adalora_init_rank: 12
      peft.adalora_target_rank: 8
      peft.total_steps: 3000                  # ~15 epochs x 1388 optimizer steps per epoch, /2
      peft.target_modules: ["c_attn", "c_proj", "c_fc"]
      training.learning_rate: 2e-4
      experiment_name: "GPT-2 Sentiment AdaLoRA Dynamic"