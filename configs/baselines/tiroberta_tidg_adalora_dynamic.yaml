# Pilot config: dynamic AdaLoRA (native 12 -> 4 schedule) on
# TiroBERTa/TiDG. Two seeds, single method, isolated output dir.
# Does NOT modify any baseline config or results directory.

base_config: "configs/experiments/tiroberta_tidg_base.yaml"

output_dir: "results/pilot/tiroberta_tidg_adalora_dynamic"
replication_count: 2
use_mlflow: false
parallel: false
max_workers: 1

statistical_analysis:
  confidence_level: 0.95
  bootstrap_samples: 100
  statistical_tests: ["effect_size"]
  multiple_comparison_correction: "holm"
  min_samples_for_analysis: 2

platform_optimizations:
  windows:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  linux:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  darwin:
    num_workers: 2
    pin_memory: false
    use_amp: true
    gradient_accumulation_steps: 2

baseline_methods:
  - name: "tiroberta_tidg_adalora_dynamic"
    description: "AdaLoRA, native dynamic 12 -> 4 pruning schedule (pilot)"
    peft_method: "adalora"
    scientific_role: "experimental"
    priority: 1
    expected_compute_hours: 0.7
    config_overrides:
      peft.method: "adalora"
      peft.optimize_hyperparams: false
      peft.rank: 8                             # ignored when *_rank set, but keeps schema happy
      peft.adalora_init_rank: 12
      peft.adalora_target_rank: 4
      peft.total_steps: 1515                   # ~15 epochs x 202 batches / 2 (grad_accum = 2)
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG AdaLoRA Dynamic (Pilot)"