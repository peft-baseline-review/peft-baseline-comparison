# ============================================================================
# TiroBERTa SAP-PEFT Baseline for TiDG (7-class news)
# ============================================================================

base_config: "configs/experiments/tiroberta_tidg_base.yaml"

output_dir: "results/baselines/tiroberta_tidg_ablation"
replication_count: 5
use_mlflow: true
parallel: false
max_workers: 4

# ============================================================================
statistical_analysis:
  confidence_level: 0.95
  bootstrap_samples: 1000
  statistical_tests: ["t_test", "effect_size", "wilcoxon_signed_rank"]
  multiple_comparison_correction: "holm"
  effect_size_thresholds:
    small: 0.2
    medium: 0.5
    large: 0.8
  min_samples_for_analysis: 2

platform_optimizations:
  windows:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  linux:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  darwin:
    num_workers: 2
    pin_memory: false
    use_amp: true
    gradient_accumulation_steps: 2

# ============================================================================
baseline_methods:
  - name: "tiroberta_tidg_sap_peft_ablation"
    description: "Structure-Adaptive Progressive PEFT (SAP-PEFT)"
    peft_method: "progressive"
    scientific_role: "experimental_novel"
    priority: 1
    expected_compute_hours: 0.6
    config_overrides:
      peft.method: "progressive"
      peft.allocation_strategy: "structure"
      peft.optimize_hyperparams: false
      peft.initial_rank: 8          # total budget = 8 * num_modules
      peft.min_rank: 2
      peft.max_rank: 32
      # TiroBERTa (RoBERTa-based) uses "attention.output.dense" for attention output, not "attention.output.dense"
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      peft.allocation_update_frequency: 200
      peft.temperature: 1.0
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG SAP-PEFT"