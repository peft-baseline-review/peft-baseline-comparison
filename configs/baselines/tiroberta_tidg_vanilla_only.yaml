# Smoke-test config: single vanilla method on TiroBERTa/TiDG.
# Not used to produce any paper table. Included so reviewers can
# verify the pipeline end-to-end in minutes rather than hours.

base_config: "configs/experiments/tiroberta_tidg_base.yaml"

output_dir: "results/baselines/tiroberta_tidg_vanilla_only"
replication_count: 5
use_mlflow: true
parallel: false
max_workers: 4

statistical_analysis:
  confidence_level: 0.95
  bootstrap_samples: 1000
  statistical_tests: ["t_test", "effect_size", "wilcoxon_signed_rank"]
  multiple_comparison_correction: "holm"
  min_samples_for_analysis: 2

platform_optimizations:
  windows:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  linux:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  darwin:
    num_workers: 2
    pin_memory: false
    use_amp: true
    gradient_accumulation_steps: 2

baseline_methods:
  - name: "tiroberta_tidg_vanilla"
    description: "Vanilla classifier (frozen base)"
    peft_method: "vanilla"
    scientific_role: "negative_control"
    priority: 4
    expected_compute_hours: 0.3
    config_overrides:
      peft.method: "vanilla"
      peft.optimize_hyperparams: false
      training.learning_rate: 2e-5
      experiment_name: "TiroBERTa TiDG Vanilla"