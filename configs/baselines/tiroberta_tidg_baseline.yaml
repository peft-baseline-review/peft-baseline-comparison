# ============================================================================
# Complete TiroBERTa Baseline on TiDG (7‑class genre)
# ============================================================================

base_config: "configs/experiments/tiroberta_tidg_base.yaml"

output_dir: "results/baselines/tiroberta_tidg"
replication_count: 5
use_mlflow: true
parallel: false
max_workers: 4

statistical_analysis:
  confidence_level: 0.95
  bootstrap_samples: 1000
  statistical_tests: ["t_test", "effect_size", "wilcoxon_signed_rank"]
  multiple_comparison_correction: "holm"
  effect_size_thresholds:
    small: 0.2
    medium: 0.5
    large: 0.8
  min_samples_for_analysis: 2

platform_optimizations:
  windows:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  linux:
    num_workers: 4
    pin_memory: true
    use_amp: true
    gradient_accumulation_steps: 2
  darwin:
    num_workers: 2
    pin_memory: false
    use_amp: true
    gradient_accumulation_steps: 2

baseline_methods:

  - name: "tiroberta_tidg_full_finetuning"
    description: "Full fine-tuning upper bound"
    peft_method: "full"
    scientific_role: "positive_control"
    priority: 1
    expected_compute_hours: 0.5
    config_overrides:
      peft.method: "full"
      model.freeze_base: false
      peft.optimize_hyperparams: false
      experiment_name: "TiroBERTa TiDG Full Fine-tuning"

  - name: "tiroberta_tidg_vanilla"
    description: "Vanilla classifier (frozen base)"
    peft_method: "vanilla"
    scientific_role: "negative_control"
    priority: 4
    expected_compute_hours: 0.3
    config_overrides:
      peft.method: "vanilla"
      peft.optimize_hyperparams: false
      experiment_name: "TiroBERTa TiDG Vanilla"

  - name: "tiroberta_tidg_lora"
    description: "LoRA (attention only)"
    peft_method: "lora"
    scientific_role: "positive_control"
    priority: 1
    expected_compute_hours: 0.4
    config_overrides:
      peft.method: "lora"
      peft.optimize_hyperparams: false
      peft.rank: 8
      peft.target_modules: ["query", "key", "value", "attention.output.dense"]
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG LoRA"

  - name: "tiroberta_tidg_dora"
    description: "DoRA (attention only)"
    peft_method: "dora"
    scientific_role: "experimental"
    priority: 2
    expected_compute_hours: 0.4
    config_overrides:
      peft.method: "dora"
      peft.use_dora: true
      peft.optimize_hyperparams: false
      peft.rank: 8
      peft.target_modules: ["query", "key", "value", "attention.output.dense"]
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG DoRA"

  - name: "tiroberta_tidg_adalora"
    description: "AdaLoRA (attention + FFN)"
    peft_method: "adalora"
    scientific_role: "experimental"
    priority: 2
    expected_compute_hours: 0.5
    config_overrides:
      peft.method: "adalora"
      peft.optimize_hyperparams: false
      peft.rank: 8
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG AdaLoRA"

  - name: "tiroberta_tidg_progressive_adaptive"
    description: "Progressive PEPT adaptive schedule (budget‑based)"
    peft_method: "progressive"
    scientific_role: "experimental_novel"
    priority: 1
    expected_compute_hours: 0.6
    config_overrides:
      peft.method: "progressive"
      peft.allocation_strategy: "budget"
      peft.rank_schedule: "adaptive"
      peft.optimize_hyperparams: false
      peft.initial_rank: 4
      peft.final_rank: 16
      peft.min_rank: 2
      peft.max_rank: 32
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      peft.allocation_update_frequency: 200
      peft.temperature: 1.0
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG Progressive Adaptive"

  - name: "tiroberta_tidg_progressive_linear"
    description: "Progressive PEPT linear ablation (budget‑based)"
    peft_method: "progressive"
    scientific_role: "ablation_study"
    priority: 5
    expected_compute_hours: 0.6
    config_overrides:
      peft.method: "progressive"
      peft.allocation_strategy: "budget"
      peft.rank_schedule: "linear"
      peft.optimize_hyperparams: false
      peft.initial_rank: 4
      peft.final_rank: 16
      peft.min_rank: 2
      peft.max_rank: 32
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      peft.allocation_update_frequency: 200
      peft.temperature: 1.0
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG Progressive Linear"

  - name: "tiroberta_tidg_progressive_fixed"
    description: "Progressive fixed rank (budget‑based)"
    peft_method: "progressive"
    scientific_role: "ablation_study"
    priority: 5
    expected_compute_hours: 0.6
    config_overrides:
      peft.method: "progressive"
      peft.allocation_strategy: "budget"
      peft.rank_schedule: "fixed"
      peft.optimize_hyperparams: false
      peft.initial_rank: 8
      peft.final_rank: 8
      peft.min_rank: 2
      peft.max_rank: 32
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      peft.allocation_update_frequency: 200
      peft.temperature: 1.0
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG Progressive Fixed"

  - name: "tiroberta_tidg_sap_peft"
    description: "Structure‑Adaptive Progressive PEFT (SAP‑PEFT)"
    peft_method: "progressive"
    scientific_role: "experimental_novel"
    priority: 1
    expected_compute_hours: 0.6
    config_overrides:
      peft.method: "progressive"
      peft.allocation_strategy: "structure"
      peft.initial_rank: 8          # total budget = 8 * num_modules
      peft.optimize_hyperparams: false
      peft.min_rank: 2
      peft.max_rank: 32
      peft.target_modules: ["query", "key", "value", "attention.output.dense", "intermediate.dense", "output.dense"]
      peft.allocation_update_frequency: 200
      peft.temperature: 1.0
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa TiDG SAP-PEFT"

