# One-off: TiroBERTa/sentiment DoRA with corrected attention-output
# projection. Same rationale as the TiDG version.

base_config: "configs/experiments/tiroberta_sentiment_base.yaml"

output_dir: "results/baselines/tiroberta_sentiment_dora_fixed"
replication_count: 5
use_mlflow: true
parallel: false
max_workers: 4

statistical_analysis:
  confidence_level: 0.95
  bootstrap_samples: 1000
  statistical_tests: ["t_test", "effect_size", "wilcoxon_signed_rank"]
  multiple_comparison_correction: "holm"
  effect_size_thresholds: {small: 0.2, medium: 0.5, large: 0.8}
  min_samples_for_analysis: 2

platform_optimizations:
  windows: {num_workers: 4, pin_memory: true,  use_amp: true, gradient_accumulation_steps: 2}
  linux:   {num_workers: 4, pin_memory: true,  use_amp: true, gradient_accumulation_steps: 2}
  darwin:  {num_workers: 2, pin_memory: false, use_amp: true, gradient_accumulation_steps: 2}

baseline_methods:
  - name: "tiroberta_sentiment_dora"
    description: "DoRA (attention only, corrected target modules)"
    peft_method: "dora"
    scientific_role: "experimental"
    priority: 2
    expected_compute_hours: 0.4
    config_overrides:
      peft.method: "dora"
      use_mlflow: false
      peft.use_dora: true
      peft.optimize_hyperparams: false
      peft.rank: 8
      peft.target_modules: ["query", "key", "value", "attention.output.dense"]
      training.learning_rate: 2e-4
      experiment_name: "TiroBERTa Sentiment DoRA"