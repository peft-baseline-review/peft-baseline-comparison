# configs/analysis/ablation.yaml
enabled: ${features.ablation_analysis if features.ablation_analysis else false}
output_dir: "${experiment_dir}/ablation_studies"

# Study configurations
studies:
  optimization_methods:
    enabled: true
    n_trials: 20
    n_replicates: 3
  efficiency_objective:
    enabled: true
    n_trials: 15
    n_replicates: 3
  target_module_detection:
    enabled: true
    n_trials: 10
    n_replicates: 3
    model_architectures:
      - bert-base-multilingual-cased
      - xlm-roberta-base
      - google/mt5-small
  peft_method_sensitivity:
    enabled: true
    n_trials: 5
    n_replicates: 3
    data_fractions: [0.1, 0.3, 0.5, 0.8, 1.0]

# Statistical settings
statistical:
  confidence_level: 0.95
  min_trials_per_condition: 10
  bootstrap_samples: 1000

# Output settings
output:
  save_plots: true
  save_reports: true
  generate_summary: true